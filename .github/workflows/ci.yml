# Checks only. CI never commits or pushes.
name: CI

# Lean on Actions minutes (private repos, owner 2026-11-14): every job runs only
# when its files changed; docs-only changes run nothing but the secret scan.
# Pull requests into any branch (stacked PRs) are checked.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      guest: ${{ steps.f.outputs.guest }}
      landing: ${{ steps.f.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            guest:
              - 'backend/resources/views/public/**'
              - 'backend/resources/public-menu/**'
              - 'backend/app/Support/PublicMenu/**'
              - 'backend/app/Http/Controllers/PublicMenuController.php'
              - 'backend/app/Http/Middleware/SecurityHeaders.php'
              - 'backend/public/.htaccess'
              - 'backend/public/sw.js'
              - 'backend/database/seeders/**'
              - 'backend/composer.lock'
              - 'ci/lighthouse/**'
              - '.github/workflows/ci.yml'
            landing:
              - 'backend/resources/views/site/**'
              - 'backend/resources/views/account/**'
              - 'backend/lang/en/landing.php'
              - 'backend/lang/en/footer.php'
              - 'backend/lang/en/site.php'
              - 'backend/resources/legal/**'
              - 'backend/resources/views/legal.blade.php'
              - 'ci/lighthouse/lighthouserc.landing.json'
              - 'backend/lang/en/account.php'
              - 'backend/app/Http/Controllers/Auth/AccountController.php'
              - 'backend/app/Http/Controllers/Auth/SignInController.php'
              - 'backend/app/Support/Site/**'
              - 'backend/public/landing/**'
              - 'backend/app/Http/Controllers/SiteController.php'
              - 'backend/app/Http/Middleware/SecurityHeaders.php'
              - 'backend/app/Support/PlatformSettings.php'
              - 'backend/composer.lock'
              - 'ci/lighthouse/**'
              - '.github/workflows/ci.yml'
      # Secret scan of the new commits only (free gitleaks binary, no licence needed).
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          if [ "${{ github.event_name }}" = pull_request ]; then range="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"; else range="${{ github.event.before }}..${{ github.sha }}"; fi
          case "$range" in 0000000*) range="-1";; esac
          ./gitleaks git --no-banner --redact --log-opts="$range" .

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    # ~23 min on develop already; the 17 styles × every guest-menu test pushed it past 25 (QUESTIONS #232).
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: menu_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, intl, pdo_mysql, zip, exif, bcmath
          coverage: none
      - name: Validate composer files
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Known vulnerabilities (composer audit)
        run: composer audit --locked --no-interaction
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Migrate → rollback → migrate
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Tests (Pest)
        run: php artisan test

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Packages that ship to browsers; build tools are audited monthly by Dependabot.
      - name: Known vulnerabilities in shipped packages (pnpm audit)
        run: pnpm audit --prod --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Build (also generates routes) + typecheck
        run: pnpm build
      # PLAN.md §15: the admin's first download, gzipped. Fails the PR if it
      # grows past the budget. Target 150 KB; current ceiling while the owner
      # decides how to get there (see PLAN.md §15.6).
      - name: Admin bundle budget
        run: node scripts/bundle-size.mjs --budget-kb=240
      - name: Install test browser
        # The runner image already has Chromium's system libraries; if the Ubuntu
        # package mirror is unreachable (it was on 2026-11-11), install the browser alone.
        run: pnpm exec playwright install chromium --with-deps || pnpm exec playwright install chromium
      - name: Tests (Vitest)
        run: pnpm test

  # Guest menu speed budget (PLAN.md §15.5): Lighthouse, mobile, throttled,
  # median of 3 runs on the demo menu, served as production serves it.
  # A PR that breaks a budget fails here.
  guest-menu-speed:
    name: guest-menu-speed (${{ matrix.style }}, ${{ matrix.banner }})
    needs: changes
    if: needs.changes.outputs.guest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every menu style must meet every speed budget (owner, 2026-11-11).
        style: [editorial, grid, bistro, minimal, mesob, lounge, board, arabic, islamic, somali, mono, colour, coffee, grill, garden, coastal, luxe]
        # …with the banner and without it: then the first photo is the largest paint (owner, 2026-11-12).
        banner: [banner, no-banner]
        # …and A without banner and specials: its full-width first dish photo is then the largest paint.
        include:
          - style: editorial
            banner: no-banner-no-specials
          # …and during a time-based price period (crossed-out prices and labels on the page).
          - style: grid
            banner: price-period
          # …and F · Night Lounge during happy hour: old and new prices, each on one line (owner, 2026-11-18).
          - style: lounge
            banner: price-period
          # …and the style options of H–L (owner, 2026-11-18): H right-to-left, I with the Halal badge and
          # Ramadan mode, K with black-and-white photos and its accent (each with the banner).
          - style: arabic
            banner: rtl
            options: rtl
          - style: islamic
            banner: ramadan
            options: halal,ramadan
          - style: mono
            banner: greyscale
            options: greyscale,accent
          # …and M–Q right-to-left with the header drawing, and with the style's pictures and icons
          # switched off (owner, 2026-11-19).
          - style: coastal
            banner: rtl
            options: rtl
          - style: coffee
            banner: no-decoration
            options: no-decoration
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: menu
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_URL: http://localhost:8124
      DEMO_MENU_STYLE: ${{ matrix.style }}
      DEMO_MENU_BANNER: ${{ (matrix.banner != 'no-banner' && matrix.banner != 'no-banner-no-specials' && matrix.banner != 'no-decoration') && '1' || '0' }}
      DEMO_MENU_OPTIONS: ${{ matrix.options || '' }}
      DEMO_MENU_PRICE_PERIOD: ${{ matrix.banner == 'price-period' && '1' || '0' }}
      DEMO_MENU_SPECIALS: ${{ matrix.banner == 'no-banner-no-specials' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, intl, pdo_mysql, zip, exif, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Demo restaurant
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force
      - name: Build the static page (first visit renders and stores it)
        run: |
          php artisan serve --port=8123 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/up > /dev/null && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8123/demo
          test -f public/menu-cache/demo/index.html.gz
          grep -q 'class="S-${{ matrix.style }}[ "]' public/menu-cache/demo/index.html
          if [ "$DEMO_MENU_BANNER" = 1 ]; then grep -q '<div class="cv' public/menu-cache/demo/index.html; else ! grep -q '<div class="cv' public/menu-cache/demo/index.html; fi
          if [ "${{ matrix.banner }}" = rtl ]; then grep -q '<html lang="en" dir="rtl">' public/menu-cache/demo/index.html; fi
          if [ "${{ matrix.banner }}" = ramadan ]; then grep -q 'class="hb"' public/menu-cache/demo/index.html && grep -q ' rm"' public/menu-cache/demo/index.html; fi
          if [ "${{ matrix.banner }}" = greyscale ]; then grep -q ' gs"' public/menu-cache/demo/index.html; fi
          case "${{ matrix.style }}" in coffee|grill|garden|coastal|luxe)
            if [ "${{ matrix.banner }}" = no-decoration ]; then ! grep -q 'class="ci"' public/menu-cache/demo/index.html && ! grep -q ' dc"' public/menu-cache/demo/index.html;
            else grep -q 'class="ci"' public/menu-cache/demo/index.html; fi
            if [ "$DEMO_MENU_BANNER" = 0 ] && [ "${{ matrix.banner }}" != no-decoration ]; then grep -q '<svg class="ha"' public/menu-cache/demo/index.html; fi;;
          esac
          if [ "${{ matrix.banner }}" = price-period ]; then grep -q 'Happy hour until' public/menu-cache/demo/index.html && grep -q '<s>' public/menu-cache/demo/index.html; fi
          if [ "${{ matrix.banner }}" = no-banner-no-specials ]; then ! grep -q '<div class="spc' public/menu-cache/demo/index.html; else grep -q '<div class="spc' public/menu-cache/demo/index.html; fi
          echo "Guest page: $(stat -c %s public/menu-cache/demo/index.html) bytes, $(stat -c %s public/menu-cache/demo/index.html.gz) gzip"
      - name: Serve it like production (Nginx, no PHP)
        run: |
          command -v nginx || (sudo apt-get update -q && sudo apt-get install -y -q nginx-light)
          sed "s#__PUBLIC__#$PWD/public#" ../ci/lighthouse/nginx.conf > /tmp/lh-nginx.conf
          nginx -e /tmp/lh-nginx-error.log -c /tmp/lh-nginx.conf
          curl -sfI -H 'Accept-Encoding: gzip' http://localhost:8124/demo
      - name: Lighthouse CI
        working-directory: ci/lighthouse
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install lhci autorun --config=./lighthouserc.json
      - name: Speed vs. targets (median of 5 runs)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, statistics
          runs = [json.load(open(f)) for f in glob.glob('../ci/lighthouse/.lighthouseci/lhr-*.json')]
          if not runs:
              raise SystemExit('No Lighthouse results.')
          med = lambda f: statistics.median(f(r) for r in runs)
          rows = [
              ('LCP', med(lambda r: r['audits']['largest-contentful-paint']['numericValue']), 1200, 1300, 'ms'),
              ('Blocking time (TBT)', med(lambda r: r['audits']['total-blocking-time']['numericValue']), 100, 200, 'ms'),
              ('CLS', med(lambda r: r['audits']['cumulative-layout-shift']['numericValue']), 0.02, 0.02, ''),
              ('Performance score', med(lambda r: r['categories']['performance']['score'] * 100), 98, None, ''),
          ]
          print('### Guest menu speed — ${{ matrix.style }}, ${{ matrix.banner }} (median of %d runs)' % len(runs))
          print('| Measure | Median | Target | CI fails above |')
          print('|---|---|---|---|')
          for name, value, target, gate, unit in rows:
              ok = value >= target if name.startswith('Performance') else value <= target
              print(f"| {name} | {value:.4g}{unit} {'✅' if ok else '⚠️'} | {target}{unit} | {gate if gate is not None else 'report only'}{unit if gate is not None else ''} |")
          PY
      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.style }}-${{ matrix.banner }}
          path: /tmp/lhci
          if-no-files-found: ignore

  # The landing page (/) must score 95+ in all four Lighthouse categories on a
  # simulated slow phone, open its largest paint within 1.5 s and never move
  # (owner, 2026-11-17).
  landing-speed:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: menu
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_URL: http://localhost:8125
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, intl, pdo_mysql, zip, exif, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev
      - name: Demo restaurants and plans
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force
      - name: Serve it like production (Nginx in front of PHP)
        run: |
          sed -i -e 's/^APP_ENV=.*/APP_ENV=production/' -e 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan config:cache && php artisan view:cache
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --port=8123 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/up > /dev/null && break; sleep 1; done
          command -v nginx || (sudo apt-get update -q && sudo apt-get install -y -q nginx-light)
          sed "s#__PUBLIC__#$PWD/public#" ../ci/lighthouse/nginx-landing.conf > /tmp/lh-landing.conf
          nginx -e /tmp/lh-landing-nginx-error.log -c /tmp/lh-landing.conf
          curl -sf -o /dev/null http://localhost:8125/
          curl -sf http://localhost:8125/ | grep -q 'id="demo"'
          curl -sf http://localhost:8125/signin | grep -q 'action="/signin"'
          curl -sf http://localhost:8125/signup | grep -q 'action="/signup"'
      - name: Lighthouse CI
        working-directory: ci/lighthouse
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install lhci autorun --config=./lighthouserc.landing.json
      - name: Scores (median of 5 runs)
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, statistics
          runs = [json.load(open(f)) for f in glob.glob('../ci/lighthouse/.lighthouseci/lhr-*.json')]
          if not runs:
              raise SystemExit('No Lighthouse results.')
          # Landing page and the account pages (QUESTIONS #222), each on its own.
          for path in sorted({r['requestedUrl'].split('8125', 1)[1] for r in runs}):
              page = [r for r in runs if r['requestedUrl'].endswith(path)]
              med = lambda f: statistics.median(f(r) for r in page)
              print('### %s (median of %d runs, simulated slow phone)' % (path, len(page)))
              print('| Measure | Median | Target |')
              print('|---|---|---|')
              for cat in ('performance', 'accessibility', 'best-practices', 'seo'):
                  v = med(lambda r: r['categories'][cat]['score'] * 100)
                  print(f"| {cat} | {v:.0f} {'✅' if v >= 95 else '❌'} | 95+ |")
              lcp = med(lambda r: r['audits']['largest-contentful-paint']['numericValue'])
              cls = med(lambda r: r['audits']['cumulative-layout-shift']['numericValue'])
              print(f"| LCP | {lcp:.0f} ms {'✅' if lcp <= 1500 else '❌'} | ≤ 1500 ms |")
              print(f"| CLS | {cls:.3f} {'✅' if cls <= 0.02 else '❌'} | ≈ 0 |")
          PY
      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-landing
          path: /tmp/lhci-landing
          if-no-files-found: ignore
