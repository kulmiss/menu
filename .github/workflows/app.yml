# Flutter admin app (moved into this monorepo under app/, 2026-11-26). Mirrors
# the checks the app's old repo ran; runs only when app/ changes. Secret scanning
# for the whole repo stays in the main CI and the weekly security scan.
name: App

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  push:
    branches: [develop]
    paths: ['app/**', '.github/workflows/app.yml']

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v5
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'app/android/**'
              - 'app/pubspec.*'
              - 'app/assets/**'
              - '.github/workflows/app.yml'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: No secrets in the app
        run: |
          ! git ls-files | grep -E '(google-services\.json|GoogleService-Info\.plist|key\.properties|\.jks$|\.keystore$|service-account.*\.json)$'
      - name: Format
        run: dart format --output=none --set-exit-if-changed -l 160 lib test integration_test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Unit, widget and golden tests
        run: flutter test --reporter=github

  android-size:
    # Release build of one ABI to catch Gradle/R8 problems and watch the size budget (< 20 MB).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'pull_request' && needs.test.outputs.android == 'true'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
        env:
          ALLOW_DEBUG_SIGNING: "true" # size check only; store builds need the upload key
      - name: Size budget
        run: |
          f=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          size=$(stat -c %s "$f"); dl=$(gzip -9 -c "$f" | wc -c)
          echo "arm64 APK file: $((size/1024/1024)) MB · download (compressed): $((dl/1024/1024)) MB ($dl bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$dl" -lt 20971520
      - name: Google Play checks (permissions, orientation, 16 KB pages)
        run: tool/play_check.sh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
