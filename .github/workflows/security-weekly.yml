# OWASP ZAP baseline (passive scan) against a local copy with demo data
# (SECURITY_REPORT.md M12). Weekly and on demand only, to save Actions minutes
# (about 8 minutes a run). It never fails the build or opens issues: read the
# report in the run's artifacts.
name: Security scan (weekly)

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: menu
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_URL: http://localhost:8123
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, intl, pdo_mysql, zip, exif, bcmath
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the admin
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Demo site
        run: |
          composer install --no-interaction --no-progress --prefer-dist --no-dev
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --class=DemoSeeder --force || true
          php artisan serve --host=0.0.0.0 --port=8123 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/up > /dev/null && break; sleep 1; done
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8123/
          rules_file_name: ci/zap-rules.tsv
          cmd_options: -a -j
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
