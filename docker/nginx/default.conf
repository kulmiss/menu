server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;
    client_max_body_size 10m;

    # Speed (PLAN.md §15): compress text, cache hashed assets and photos for a year.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ ^/(app/assets|media|menu-assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /var/www/docker/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # QR links: one redirect from a pre-built map, no Laravel (PLAN.md §15.2.11).
    rewrite "^/[qQ]/([A-Za-z0-9]{8})$" /qr.php?c=$1 last;

    # Guest menu pages: the static copy (and its .gz) without PHP (PLAN.md §15.2.1).
    location ~ "^/([a-z0-9-]+)/([a-z0-9-]+)$" {
        if ($args != "") { rewrite ^ /index.php last; }
        gzip_static on;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Guest pages: scripts are limited by the <meta> policy in the page itself.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        include /var/www/docker/nginx/security-headers.conf;
        try_files /menu-cache/$1/$2/index.html /index.php?$query_string;
    }

    location ~ "^/([a-z0-9-]+)$" {
        if ($args != "") { rewrite ^ /index.php last; }
        gzip_static on;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Guest pages: scripts are limited by the <meta> policy in the page itself.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        include /var/www/docker/nginx/security-headers.conf;
        try_files /menu-cache/$1/index.html /index.php?$query_string;
    }

    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include /var/www/docker/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        include /var/www/docker/nginx/security-headers.conf;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
