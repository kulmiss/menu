# Security headers for static files (SECURITY_REPORT.md H1). Included in every
# location that serves files without PHP; Laravel sets its own on PHP answers.
# Nginx drops server-level add_header in a location that has its own, hence the include.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# With HTTPS (certbot): uncomment. Browsers then refuse plain http for a year.
# add_header Strict-Transport-Security "max-age=31536000" always;
