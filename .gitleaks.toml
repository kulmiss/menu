# Secret scan settings (CI "changes" job, scripts/pre-commit-secrets.sh).
# Default gitleaks rules, except that made-up passwords in the backend tests
# ("correct-horse-battery" and the like) are not secrets.
[extend]
useDefault = true

[[allowlists]]
description = "Example passwords in tests"
targetRules = ["generic-api-key"]
paths = ['''^backend/tests/''']

[[allowlists]]
description = "The made-up Telegram bot token of the alert tests (the example from Telegram's bot documentation)"
condition = "AND"
targetRules = ["telegram-bot-api-token"]
regexes = ['''123456789:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsawQ''']
paths = ['''^backend/tests/''', '''^frontend/src/.*\.test\.tsx$''']
