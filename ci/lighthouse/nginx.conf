# CI only: serves backend/public the way production does for guest pages
# (static copy + .gz, no PHP), so Lighthouse measures the real fast path.
worker_processes 1;
pid /tmp/lh-nginx.pid;
error_log /tmp/lh-nginx-error.log;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/lh-nginx-body;
    proxy_temp_path /tmp/lh-nginx-proxy;
    fastcgi_temp_path /tmp/lh-nginx-fastcgi;
    uwsgi_temp_path /tmp/lh-nginx-uwsgi;
    scgi_temp_path /tmp/lh-nginx-scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8124;
        root __PUBLIC__;
        location ~ "^/([a-z0-9-]+)$" {
            gzip_static on;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            # The production security headers (SECURITY_REPORT.md H1), so speed is measured with them.
            add_header Content-Security-Policy "object-src 'none'; base-uri 'none'" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
            try_files /menu-cache/$1/index.html =404;
        }
        location /menu-assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /media/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # The beacon is PHP-only; answer it here so the page sees no error.
        location = /api/v1/beacon { return 204; }
    }
}
