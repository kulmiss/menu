# CI only: the landing page (/) the way production serves it: Nginx in front,
# static files (images) from backend/public with gzip, the page from PHP.
worker_processes 1;
pid /tmp/lh-landing-nginx.pid;
error_log /tmp/lh-landing-nginx-error.log;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/lh-landing-body;
    proxy_temp_path /tmp/lh-landing-proxy;
    fastcgi_temp_path /tmp/lh-landing-fastcgi;
    uwsgi_temp_path /tmp/lh-landing-uwsgi;
    scgi_temp_path /tmp/lh-landing-scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    server {
        listen 8125;
        root __PUBLIC__;
        location /landing/ {
            add_header Cache-Control "public, max-age=604800";
        }
        location / {
            proxy_pass http://127.0.0.1:8123;
            proxy_set_header Host localhost:8125;
            proxy_set_header Accept-Encoding "";
        }
    }
}
